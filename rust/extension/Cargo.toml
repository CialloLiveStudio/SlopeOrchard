[package]
name = "slope-orchard-extension"
version = "0.4.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib"]

[features]
default = ["desktop"]
desktop = ["godot/api-4-5"]
web = ["godot/api-4-7", "godot/experimental-wasm", "godot/experimental-wasm-nothreads"]

[dependencies]
godot = { version = "=0.5.5", default-features = false, features = ["lazy-function-tables"] }
slope-orchard-core = { path = "../core" }
serde_json = "=1.0.149"
